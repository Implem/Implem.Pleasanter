name: Rebuild Docker image (base image refresh)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to rebuild (e.g. Pleasanter_1.5.9.1)'
        required: true
      revision:
        description: 'Revision suffix (e.g. r1)'
        required: true
      update_latest:
        description: 'Also update latest / codedefiner (only if this is the newest release)'
        type: boolean
        default: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - id: split
        env:
          RELEASETAG: ${{ inputs.release_tag }}
        run: |
          echo "RELEASEVER=${RELEASETAG##Pleasanter_}" >> "$GITHUB_OUTPUT"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        with:
          version: "lab:latest"
          driver: cloud
          endpoint: "implem/pleasanter-release-builder"

      - id: meta1
        uses: docker/metadata-action@v5
        with:
          images: implem/pleasanter
          tags: |
            type=raw,value=${{ steps.split.outputs.RELEASEVER }}
            type=raw,value=${{ steps.split.outputs.RELEASEVER }}-${{ inputs.revision }}
            type=raw,value=latest,enable=${{ inputs.update_latest }}
          labels: |
            org.opencontainers.image.version=${{ steps.split.outputs.RELEASEVER }}-${{ inputs.revision }}
            org.opencontainers.image.revision=${{ steps.split.outputs.SHA }}

      - name: Build and push (Pleasanter)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Implem.Pleasanter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta1.outputs.tags }}
          labels: ${{ steps.meta1.outputs.labels }}

      - name: Build and push (CodeDefiner)
        if: ${{ inputs.update_latest }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Implem.CodeDefiner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: implem/pleasanter:codedefiner
